<title>AI Safety Career Map</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap">
<style>
/* Layout: one-screen app. Logo bar, path chips, then the chart (trunk on the left, six coloured paths running right to a shared bar). A detail panel slides over the right edge on click.
   Brand (AI Safety Said Simply visual identity, Oct 2026): Ink on Paper, flat colour, no shadows. Corners are rounded at the team's request: anything you press is an oval. Helvetica Neue for text, Baskerville Bold for headings,
   bold small caps for labels. Strand does one job per screen: the clause in the map title. Path colours come from the extended palette, which is for diagrams. */
:root{
  --paper:#ffffff;--paper2:#f5f5f5;--dot:#ebebeb;--card:#ffffff;--ink:#111111;--ink2:#262626;--mute:#595959;--rule:#d4d4d4;
  --strand:#c64d0a;--live:#ff8a3d;
  --t:#1b3a4b;--p:#1e5c44;--o:#5c534c;--c:#8c3410;--op:#e2a100;--f:#ff8a3d;
  --t-on:#ffffff;--p-on:#ffffff;--o-on:#ffffff;--c-on:#ffffff;--op-on:#111111;--f-on:#111111;
  --sans:"Helvetica Neue",Helvetica,Arial,"TeX Gyre Heros",sans-serif;--serif:Baskerville,"Libre Baskerville",Georgia,serif;
  --disp:var(--sans);--body:var(--sans);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#111111;--paper2:#1c1c1c;--dot:#262626;--card:#111111;--ink:#ffffff;--ink2:#ebebeb;--mute:#a6a6a6;--rule:#333333;--strand:#e0662a;
  --t:#7d9bad;--p:#6fae93;--o:#b3aaa2;--c:#d98a68;--op:#e2a100;--f:#ff8a3d;--t-on:#111111;--p-on:#111111;--o-on:#111111;--c-on:#111111;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#111111;--paper2:#1c1c1c;--dot:#262626;--card:#111111;--ink:#ffffff;--ink2:#ebebeb;--mute:#a6a6a6;--rule:#333333;--strand:#e0662a;
  --t:#7d9bad;--p:#6fae93;--o:#b3aaa2;--c:#d98a68;--op:#e2a100;--f:#ff8a3d;--t-on:#111111;--p-on:#111111;--o-on:#111111;--c-on:#111111;color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:15px/1.5 var(--body)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* Labels: Helvetica bold small caps. */
.kind,.panel h3,.listwrap h3,.stepper span,.do b,details.more summary,.h3btn{font-family:var(--sans);font-weight:700;font-variant-caps:all-small-caps;letter-spacing:.08em;text-transform:none}

.bar{background:var(--card);color:var(--ink);display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.bar>*{max-width:100%;min-width:0}
.brand{display:flex;align-items:center;color:var(--ink);text-decoration:none}
.brand svg{height:40px;width:auto;flex:none}
.bar h1{font:700 22px/1.1 var(--serif);margin:0}
.bar .sub{font-size:13px;color:var(--mute);margin:0;flex:1;min-width:180px}
.cta{background:var(--ink);color:var(--paper);font:500 14px/1.2 var(--sans);text-decoration:none;padding:11px 18px;border-radius:999px}
.planbtn{background:var(--paper2);border:0;color:var(--ink);font:500 14px/1.2 var(--sans);padding:11px 18px;border-radius:999px}

.chips{display:flex;gap:8px;align-items:center;padding:8px 16px;overflow-x:auto;border-bottom:1px solid var(--rule);background:var(--card)}
.chip{flex:none;font:600 13px/1 var(--sans);padding:8px 14px;border:2px solid var(--k,var(--ink));border-radius:999px;background:none;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--k,var(--ink));color:var(--kon,var(--paper))}
.sep{flex:1;min-width:8px}
.tool{flex:none;font:500 14px/1 var(--sans);padding:9px 14px;border:0;border-radius:999px;background:var(--paper2)}

.stage{flex:1;min-height:0;display:flex;position:relative}
.mapwrap{flex:1;min-width:0;position:relative;overflow:hidden;touch-action:none;background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:22px 22px;cursor:grab}
.mapwrap.drag{cursor:grabbing}
.mapwrap svg{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.listwrap{flex:1;min-width:0;overflow:auto;padding:16px}
.panel{position:absolute;top:0;right:0;bottom:0;width:400px;max-width:100%;overflow:auto;background:var(--card);border-left:1px solid var(--ink);padding:16px;z-index:3}
@media (max-width:820px){.panel{top:auto;left:0;width:auto;max-height:62%;border-left:0;border-top:1px solid var(--ink)}}

/* chart */
.trunk{stroke:var(--ink);fill:none;stroke-linecap:round}
.e{fill:none;stroke-linecap:round}
.n,.pin,.lane,.sg,.tofound{cursor:pointer}
.n,.e,.sg,.pin,.lane,.tofound,.ann{transition:opacity .25s}
svg.focus .dim{opacity:.1}
.lbl{font:500 18px var(--sans);fill:var(--ink);text-anchor:middle}
.lbl.r{text-anchor:start}
.hublbl{font:700 26px var(--sans);font-variant-caps:all-small-caps;letter-spacing:.08em;fill:var(--ink);text-anchor:middle}
.stg{font:700 17px var(--sans);font-variant-caps:all-small-caps;letter-spacing:.08em;text-anchor:middle;fill:var(--mute)}
.stg.ink{fill:var(--ink)}
.bk{fill:var(--paper);opacity:.92}
.lanetxt{font:600 22px var(--sans);text-anchor:middle}
.bartxt{font:700 24px var(--sans);font-variant-caps:all-small-caps;fill:var(--ink);text-anchor:middle;letter-spacing:.1em}
.title{font:700 60px var(--serif);fill:var(--ink)}
.title .plain{font:500 60px var(--sans);fill:var(--strand)}
.tsub{font:400 26px var(--sans);fill:var(--mute)}
.leg{font:400 19px var(--sans);fill:var(--mute)}
.pname{font:700 16px var(--sans);fill:var(--ink)}
.halo{fill:none;stroke:var(--ink);stroke-width:4;opacity:0}
.n.sel .halo{opacity:1}
.badge{display:none}.n.inplan .badge{display:block}
@keyframes pulse{0%{r:60;opacity:.8}100%{r:92;opacity:0}}
.pulse{fill:none;stroke:var(--live);stroke-width:5;animation:pulse 2.2s ease-out infinite}
svg.started .pulse{display:none}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:0}.n,.e{transition:none}}

/* panel */
.panel h2{font:700 25px/1.2 var(--serif);margin:0;text-wrap:balance}
.panel h3{font-size:14px;line-height:1;color:var(--mute);margin:20px 0 6px}
.panel p{margin:8px 0 0}
.ptop{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px}
.tabs{display:flex;gap:6px}
.tab{font:500 13px/1 var(--sans);padding:9px 14px;border:0;border-radius:999px;background:var(--paper2)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.stepper{display:flex;align-items:center;gap:8px;margin:0 0 14px;padding:6px;background:color-mix(in srgb,var(--k,var(--ink)) 12%,var(--paper));border-radius:28px}
.stepper span{flex:1;text-align:center;font-size:14px;line-height:1.25;color:var(--ink2)}
.stepper button{font:500 14px/1 var(--sans);padding:9px 14px;border:0;border-radius:999px;background:var(--ink);color:var(--paper)}
.stepper button:disabled{opacity:.3;cursor:default}
.ph{display:flex;gap:12px;align-items:center}
.av{flex:none;width:56px;height:56px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;border:3px solid var(--k,var(--ink))}
.av img{width:100%;height:100%;object-fit:cover}
.av.act{background:var(--k,var(--ink))}.av svg{width:30px;height:30px}
.av.sm{width:34px;height:34px;border-width:2px}.av.sm svg{width:18px;height:18px}
.kind{font-size:13px;line-height:1.3;color:var(--mute);margin:0 0 4px!important}
.do{padding:12px 16px;margin-top:14px;background:var(--paper2);border-radius:18px}
.do b{font-size:14px;line-height:1}
.do p{margin:4px 0 0}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{font:500 15px/1 var(--sans);padding:12px 18px;border:0;border-radius:999px;background:var(--paper2);text-decoration:none}
.btn.pri,.btn.on{background:var(--ink);color:var(--paper)}
.pill{display:inline-block;font:600 13px/1 var(--sans);color:var(--kon,#fff);background:var(--k);padding:7px 12px;border:0;border-radius:999px;margin:0 4px 4px 0}
.myth{font:500 19px/1.35 var(--sans);color:var(--ink2);margin-top:10px!important}
.rowbtn{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:8px 0}
.rowbtn span.t{flex:1;min-width:0;font-weight:500}
.rowbtn small{color:var(--mute);font-size:12.5px;display:block;font-weight:400}
.h3btn{background:none;border:0;padding:0;font-size:14px;line-height:1;color:var(--ink);margin:20px 0 6px;display:block;text-decoration:underline;text-decoration-color:var(--k);text-decoration-thickness:2px;text-underline-offset:4px}
details.more{border-top:1px solid var(--rule)}
details.more summary{cursor:pointer;padding:9px 0;font-size:14px;color:var(--mute)}
details.more[open] summary{color:var(--ink)}
.plan li{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--rule);padding:10px 0}
.plan ul{list-style:none;margin:8px 0 0;padding:0}
.plan input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--ink)}
.plan .t{flex:1;min-width:0}.plan .done{text-decoration:line-through;color:var(--mute)}
.x{background:none;border:0;font-size:22px;line-height:1;color:var(--mute);padding:2px 6px}
.mute{color:var(--mute);font-size:13px}
.listwrap h2{font:700 25px/1.2 var(--serif);margin:28px 0 4px;display:flex;align-items:center;gap:10px}
.listwrap h2::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--k,var(--ink));flex:none}
.listwrap h3{font-size:14px;line-height:1;color:var(--mute);margin:16px 0 2px}
.listwrap section{max-width:720px;margin:0 auto}
</style>

  do:"Message one person who has the job you want and ask for 20 minutes." });

T("advising", 960, 795, "sat", "Career\nadvising", { logo:"80k", parent:["student","mid"], lp:"r", kind:"Advice", tag:"Free · 1:1 call · students and professionals", url:"https://80000hours.org/speak-with-us/", link:"Apply for a call",

T("funding", 960, 1025, "sat", "Transition\nfunding", { logo:"bluedot", parent:["student","mid"], lp:"r", kind:"Funding", tag:"$20k to $200k · rolling", url:"https://bluedot.org/grants/career-transition", link:"Open Career Transition Grants",
  text:"Money shouldn't be what stops you. In September 2026 Coefficient Giving handed its career development and transition funding to BlueDot. BlueDot's Career Transition Grants usually start at $20k and go up to $200k, for people ready to switch full-time: time to produce research or policy work, fill a skill gap or test a path. The application takes about 45 minutes and asks for recent work, milestones and a simple budget. For something smaller, Rapid Grants go up to $20k.",
  do:"Check BlueDot's grants page and note what you'd ask for and why." });

T("pick", 1250, 910, "hub", "PICK A PATH", { icon:"compass", kind:"Step 2", tag:"Six paths", parent:["learn"], lx:15,
  text:"Six paths, and most don't need a technical background. They overlap on purpose: a circle with several colours in its ring belongs to several paths, so you can start before you have fully decided. Every path starts the same way, by reaching out to people in your field, and ends the same way, by helping build the field. Your route probably won't be a straight line.",
  do:"Click a coloured path name to see the whole route and what it pays, then press Start this path." });

/* ---------- the two steps every path shares: one node where the paths split, one bar where they end ---------- */
NODES.push({ id:"reach", type:"hub", label:"REACH OUT", title:"Reach out to people in your field", lx:-60, ly:-68, icon:"chat", lanes:ALL, onTrunk:1, st:Object.fromEntries(ALL.map(l => [l, -1])), pos:[{ x:REACHX, y:910, lanes:ALL }],
  kind:"Every path", tag:"Free · one message a day",
  text:"This is the step every path shares. People in AI safety love to help, and they want more people in the field. Find someone doing the work you want to do, whatever your field is, and ask them one specific question. Most will say yes to twenty minutes. One conversation often leads to an introduction, a project or a job you would never have seen posted.",
  do:"Message one person today. Three sentences: who you are, what you liked about their work, and one specific question." });
// Where the paths meet again. Its three stops fan out forward, like the paths do from "Reach out", and come after it in every path's step order (stage 10).

T("build", ENDX, 910, "hub", "BUILD THE\nFIELD", { title:"Help build the field", icon:"people", lanes:ALL, st:Object.fromEntries(ALL.map(l => [l, 9])),
  kind:"Every path", tag:"Where every path ends",
  text:"Every path ends the same way: by leaving the field bigger and better than you found it. Go to events and meet people in person. Reach back out to the people starting where you started. And keep watching for problems nobody is working on yet, because the field changes as fast as the technology does.",
  do:"Pick one of the three this month: an event to go to, a newcomer to help, or a problem to write down." });
T("events", ENDX + 240, 700, "sat", "Go to\nevents", END({ icon:"people", kind:"Every path", tag:"Conferences and meetups", url:"https://www.aisafety.com/events", link:"Open the events calendar",
  text:"Whatever path you're on, people hire people they have met. AISafety.com keeps a calendar of conferences, workshops and meetups. EA Global has a large AI safety track and runs in San Francisco (19 to 21 March 2027), London (28 to 30 May 2027) and Washington DC (15 to 17 October 2027). ControlConf covers AI control research. One good conversation in person can do more than a month of applications.",
  do:"Pick one event in the next three months and apply or register today." }));
T("giveback", ENDX + 240, 910, "sat", "Reach back\nout", END({ icon:"chat", kind:"Every path", tag:"An hour a month",
  text:"Someone answered your first message. Return the favour. Reply to the people who reach out to you, mentor a newcomer through a program such as SPAR, introduce people who should know each other, and write up how you got in so the next person has a map.",
  do:"Reply to every cold message you get this month, and offer one person twenty minutes." }));
T("problems", ENDX + 240, 1120, "sat", "Find new\nproblems", END({ icon:"search", kind:"Every path", tag:"Ongoing", url:"https://coefficientgiving.org/tailwind", link:"See Project Tailwind's idea list",
  text:"AI keeps changing, and so do the problems. New capabilities open up risks nobody is working on yet, and people inside the field are usually the first to notice. Keep a running list of the gaps you see. Funders publish lists of the research and organisations they want to exist, and some of the field's most useful projects started as one person's note to self.",
  do:"Start a list today, and add one problem a month that you think nobody owns." }));

/* ---------- paths ---------- */
// Row 0: technical
L("bdtech",0,0,-.6,"BlueDot: Technical\nAI Safety",["technical"],{logo:"bluedot",kind:"Course",tag:"Free · part-time",url:"https://bluedot.org",link:"Open BlueDot",
  text:"The technical version of BlueDot's course: why making AI safe is hard, what current techniques can and can't do, and where you could contribute.",do:"Apply to the next cohort."});
L("arena",0,0,.6,"ARENA",["technical"],{logo:"arena",kind:"Course",tag:"Free online · or 5 weeks in London",url:"https://www.arena.education/",link:"Open ARENA",
  text:"A hands-on machine learning curriculum focused on AI safety. The material is free online, and there is a funded in-person bootcamp in London several times a year.",do:"Open the first chapter and do one exercise tonight."});
L("labproject",0,1,-1,"Join a lab\nproject",["technical"],{icon:"flask",kind:"Action",tag:"One semester",
  text:"A supervised project in a university lab is how many researchers start. It doesn't need to be an AI safety lab: any solid machine learning research experience counts.",do:"Email one professor or grad student with a two-line project idea."});
L("apart",0,1,0,"Apart\nhackathons",["technical"],{logo:"apart",kind:"Event",tag:"Free · one weekend",url:"https://apartresearch.com",link:"Open Apart Research",
  text:"Weekend research sprints on AI safety topics, online and in local hubs. A fast way to finish a first project and find collaborators.",do:"Sign up for the next sprint."});
L("neglected",0,1,1,"Pick a\nneglected area",["technical"],{icon:"target",kind:"Action",tag:"Choose before you specialise",
  text:"Some areas, such as mechanistic interpretability, are crowded. Three that need more people: AI security, which stops bad actors or the models themselves from getting past the guardrails. AI control, which is about supervising huge numbers of AI systems that might misbehave. Technical governance, which builds tools such as ways to check what a data centre is being used for, so countries can verify each other.",do:"Read one paper from each area and pick the one you'd happily spend a year on."});
L("mats",0,2,-1,"MATS",["technical"],{logo:"mats",kind:"Fellowship",tag:"Funded · about 10 weeks",url:"https://www.matsprogram.org/",link:"Open MATS",
  text:"The best-known research fellowship in the field. You work with a mentor on a research project, with a stipend, compute and housing. Around 80% of alumni now work in AI safety. Fewer than 10% of applicants get in.",do:"Read the mentor list and note two whose work you could contribute to."});
L("anthfellows",0,2,0,"Anthropic\nFellows",["technical"],{logo:"anthropic",kind:"Fellowship",tag:"About $3,850 a week · 4 months",url:"https://www.anthropic.com",link:"Open Anthropic",
  text:"A paid safety research fellowship with mentorship from Anthropic researchers. It doesn't require a PhD or published papers, and a large share of fellows have received full-time offers.",do:"Check when the next cohort opens and put the date in your calendar."});
L("lasr",0,2,1,"LASR Labs",["technical"],{logo:"lasr",kind:"Fellowship",tag:"Funded · 13 weeks · London",url:"https://www.lasrlabs.org/",link:"Open LASR Labs",
  text:"A 13-week research program in London that runs three times a year, with a stipend of about £15,000. Good if you're based in the UK or Europe.",do:"Check the next application window."});
L("labs",0,3,-1,"Lab safety\nteams",["technical"],{logo:"deepmind",kind:"Employer",tag:"Full-time",url:"https://jobs.80000hours.org",link:"See open roles",
  text:"Anthropic, Google DeepMind and OpenAI all have safety teams with direct access to the most capable models. Whether working at a lab helps or speeds things up is a real debate in the field, so read both sides.",do:"Read three lab safety job postings and list the skills they share."});
L("redwood",0,3,0,"Redwood\nResearch",["technical"],{logo:"redwood",kind:"Employer",tag:"Full-time",url:"https://www.redwoodresearch.org",link:"Open Redwood",
  text:"An independent research group known for its work on AI control. One of several independent groups that hire, alongside Apollo Research, FAR.AI and Palisade Research.",do:"Read one Redwood post on AI control."});
L("metr",0,3,1,"METR",["technical"],{logo:"metr",kind:"Employer",tag:"Full-time",url:"https://metr.org",link:"Open METR",

L("publish",0,4,-.6,"Publish and\npresent",["technical"],{icon:"doc",kind:"Action",tag:"After every project",

L("leadresearch",0,4,.6,"Lead a\nresearch agenda",["technical"],{icon:"up",kind:"Action",tag:"Two to four years in",
  text:"After a first role, the next steps are leading projects, managing other researchers, or taking a neglected problem and building a team around it. People who can both do research and manage it are in short supply.",do:"Ask your manager or mentor what leading a project would take, and volunteer for the next one."});
// Row 1: technical + policy
L("bdgov",1,0,-.6,"BlueDot:\nAI Governance",["policy"],{logo:"bluedot",kind:"Course",tag:"Free · no technical background",url:"https://bluedot.org",link:"Open BlueDot",
  text:"A fast way to get up to speed on how advanced AI could be governed. No technical background needed.",do:"Apply to the next cohort."});
L("readlaw",1,0,.6,"Read one real\nAI law",["policy"],{icon:"doc",kind:"Action",tag:"One evening",
  text:"Read actual law and actual company safety policies, not commentary about them. Try California's SB 53 or a chapter of the EU AI Act, and one AI company's published safety framework.",do:"Read one tonight and write five bullet points on what it requires."});
L("spar",1,1,-1,"SPAR",["technical","policy"],{logo:"kairos",kind:"Program",tag:"Part-time · remote · 3 months",url:"https://spar.kairos-project.org/",link:"Open SPAR",also:[[4,2,0,["comms","ops"]]],

L("techgov",1,1,0,"Technical\ngovernance",["technical","policy"],{icon:"compass",kind:"Focus area",tag:"Where the two paths meet",
  text:"Policy that needs engineers: checking what data centres are used for, tracking AI chips, building tests that regulators can rely on. Technical people who can write for policymakers are rare, and policy people who understand the hardware are rarer.",do:"Read GovAI's report on computing power and AI governance."});
L("tool",1,1,1,"Pick one\ntool",["policy"],{icon:"target",kind:"Action",tag:"Decide this month",
  text:"Who writes the rule that makes a company responsible if its AI causes serious damage? Who sets the standard for whether a system is safe to release? Pick one tool, such as export controls, liability or safety standards, and become the person who knows it.",do:"Choose one tool and find the three people who write about it most."});
L("astra",1,2,-1,"Astra\nFellowship",["technical","policy"],{logo:"constellation",kind:"Fellowship",tag:"About $8,400 a month · Berkeley",url:"https://constellation.org/programs",link:"Open Constellation",

L("era",1,2,0,"ERA\nFellowship",["technical","policy"],{logo:"era",kind:"Fellowship",tag:"Funded · 10 weeks · Cambridge UK",url:"https://erafellowship.org",link:"Open ERA",

L("horizon",1,2,1,"Horizon\nFellowship",["policy"],{logo:"horizon",kind:"Fellowship",tag:"$78k to $190k+ · Washington DC",url:"https://horizonpublicservice.org/",link:"Open Horizon",

L("aisi",1,3,-1,"UK AI Security\nInstitute",["technical","policy"],{logo:"aisi",kind:"Employer",tag:"£65k to £145k",url:"https://www.aisi.gov.uk",link:"Open AISI",

L("rep",2,0,.6,"Meet your\nrepresentative",["outside"],{icon:"mail",kind:"Action",tag:"15 minutes · this week",

L("localgroup",2,1,1,"Find a\nlocal group",["outside"],{logo:"aisafety",kind:"Community",tag:"Free",url:"https://www.aisafety.com/communities",link:"Find a group",

L("talos",2,2,1,"Talos\nFellowship",["policy"],{logo:"talos",kind:"Fellowship",tag:"EU route · paid placement",url:"https://www.talosnetwork.org/talos-fellowship",link:"Open Talos",

L("euai",2,3,-1,"EU AI Office",["policy"],{logo:"eu",kind:"Employer",tag:"Brussels",url:"https://digital-strategy.ec.europa.eu/en/policies/ai-office",link:"Open the AI Office",

L("encode",2,3,0,"Encode",["policy","outside"],{logo:"encode",kind:"Advocacy group",tag:"Volunteer or staff",url:"https://encodeai.org",link:"Open Encode",

L("ari",2,3,1,"Americans for Resp.\nInnovation (ARI)",["policy","outside"],{logo:"ari",kind:"Advocacy group",tag:"Guides + staff roles",url:"https://ari.us",link:"Open ARI",

L("techcongress",2,4,-.6,"Into Congress:\nTechCongress",["policy"],{logo:"techcongress",kind:"Fellowship",tag:"About $100k · one year",url:"https://techcongress.io",link:"Open TechCongress",

L("statebill",2,4,.6,"Help pass a\nstate law",["policy","outside"],{icon:"building",kind:"Action",tag:"Where much AI law is made",

// Row 3: outside work + communications
L("talk",3,0,0,"Talk about it",["outside","comms"],{icon:"chat",kind:"Action",tag:"Free · today",
  text:"Most people have never heard a calm, clear explanation of AI risk from someone they trust. Explaining it to one friend is also the cheapest test of whether you'd enjoy doing it for a living.",do:"Explain one thing you learned to one person today, without jargon."});
L("pauseai",3,1,-1,"PauseAI",["outside"],{logo:"pauseai",kind:"Advocacy group",tag:"Free tools · local groups",url:"https://pauseai.info/action",link:"Open PauseAI's tools",
  text:"A volunteer movement with free letter and meeting builders that walk you through contacting lawmakers step by step. PauseAI US reports 47 local groups in 29 states and 192 meetings with members of Congress in 2024 and 2025.",do:"Use the meeting builder to draft your request to your representative."});
L("controlai",3,1,0,"ControlAI",["outside"],{logo:"controlai",kind:"Advocacy group",tag:"Campaign tools",url:"https://controlai.com",link:"Open ControlAI",
  text:"A campaign group with tools for contacting lawmakers and briefings written for the public.",do:"Send one message through their tool, rewritten in your own words."});
L("oped",3,1,1,"Write an op-ed\nor letter",["outside","comms"],{icon:"pencil",kind:"Action",tag:"One evening",
  text:"Local papers print letters from residents, and lawmakers' staff read them. It is advocacy and writing practice at the same time, and a published piece is something you can point to later.",do:"Write 200 words to your local paper about one AI issue that affects your town."});
L("table",3,2,-1,"Table or\ndemonstrate",["outside"],{icon:"megaphone",kind:"Action",tag:"Microgrants available",url:"https://pauseai.info/microgrants",link:"See PauseAI microgrants",

L("local",3,2,0,"Show up\nlocally",["outside"],{icon:"building",kind:"Action",tag:"One evening",

L("frame",3,2,1,"Frame\nFellowship",["comms"],{logo:"frame",kind:"Fellowship",tag:"10 weeks · San Francisco · costs covered",url:"https://www.framefellowship.com/",link:"Open Frame",

L("give",3,3,-.6,"Give",["outside"],{logo:"longview",kind:"Funding",tag:"Any amount",url:"https://www.longview.org/fund/emerging-challenges-fund/",link:"Open the fund",

L("indie",3,3,.6,"Go\nindependent",["comms"],{icon:"play",kind:"Action",tag:"Your own channel",

L("chapter",3,4,-.6,"Start a chapter\nor lead a group",["outside"],{logo:"pauseai",kind:"Action",tag:"Stipends for organisers",url:"https://pauseai.info/microgrants",link:"See PauseAI funding",

L("fulltime",3,4,.6,"Build an audience,\ngo full-time",["comms"],{icon:"up",kind:"Action",tag:"One to two years",
  text:"Creators move to full-time through a fellowship, a staff role or audience support. Your public body of work is your application to everything on this path, so keep it in one place and keep adding to it.",do:"Make one page that links your five best pieces."});

L("post60",4,0,-1,"Post a\n60-second video",["comms"],{icon:"play",kind:"Action",tag:"Tonight",
  text:"If you want to start right now from your bedroom, make and post one sixty-second video. It will be rough, and that is fine. Nobody starts good.",do:"Record one take explaining one idea, and post it."});

L("commslearn",4,1,-1,"Learn safety\ncomms",["comms"],{logo:"cais",kind:"Guide",tag:"Free · one evening",url:"https://safe.ai/act/talk",link:"Read the guide",

L("volunteer",4,1,0,"Volunteer\nyour skills",["comms","ops"],{icon:"heart",kind:"Action",tag:"A few hours a week",

    <div class="ph">${avatar(n)}<div><p class="kind">${esc(n.kind || "")}${n.tag ? " · " + esc(n.tag) : ""}</p><h2>${esc(flat(n))}</h2></div></div>
    <p>${esc(n.text)}</p>
    <div class="do"><b>Do this</b><p>${esc(n.do)}</p></div>
    <div class="btns">${n.url ? `<a class="btn pri" href="${n.url}" target="_blank" rel="noopener">${esc(n.link || "Open site")} &#8599;</a>` : ""}
      <button class="btn ${plan[id] ? "on" : ""}" data-plan="${id}">${plan[id] ? "In my plan ✓" : "Add to my plan"}</button></div>
    ${n.lanes.length > 1 ? `<h3>Counts on ${n.lanes.length === 6 ? "every path" : n.lanes.length + " paths"}</h3><div>${n.lanes.map(l => `<button class="pill" style="${kv(l)}" data-go="${id}" data-ctx="${l}" data-follow="1">${esc(LANE[l].name)}${l === ctx ? " ✓" : ""}</button>`).join("")}</div><p class="mute">Pick a path to keep clicking through from here along that line.</p>`
      : n.lanes.length ? `<h3>On this path</h3><div><button class="pill" style="${kv(n.lanes[0])}" data-lanego="${n.lanes[0]}">${esc(LANE[n.lanes[0]].name)}</button></div>` : ""}
    ${id === "pick" ? `<h3>The six paths</h3><div>${LANES.map(l => `<button class="pill" style="${kv(l.id)}" data-lanego="${l.id}">${esc(l.name)}</button>`).join("")}</div>` : ""}
    ${more.length ? `<h3>More like this</h3>${more.map(m => rowBtn(m, ctx)).join("")}` : ""}
    ${lead ? `<h3>Where this can lead</h3>${foundBtn(ctx)}` : ""}
    ${kids.length ? `<h3>From here</h3>${kids.map(k => rowBtn(k, ctx)).join("")}` : ""}
    ${here.length ? `<h3>Who went this way</h3>${here.map(personBtn).join("")}` : ""}`);
  if (moving) setFocus(ctx); else mark();
  if (view === "map" && !moving && n.pos.length) { const p = ctx === "trunk" ? n.pos[0] : posFor(n, ctx); setTimeout(() => reveal(p.x, n.type === "bar" ? LANE[ctx].y : p.y), 440); }
}
function step(d) { if (!sel || NODE[sel].type === "extra") return; const seq = SEQ[ctx], i = seq.indexOf(sel) + d; if (i >= 0 && i < seq.length) showNode(seq[i], ctx, true); }
function showLane(id) {
  const l = LANE[id]; sel = null; ctx = id; lastInfo = () => showLane(id);
  const ppl = PEOPLE.filter(p => p.lane === id);
  openPanel(`<p class="kind">Path</p><h2>${esc(l.name)}</h2>
    <p class="myth">${esc(l.myth)}</p><p>${esc(l.why)}</p>
    <div class="btns"><button class="btn pri" data-go="${SEQ[id][0]}" data-ctx="${id}" data-follow="1">Start this path &#8250;</button></div>
    <h3>First, on every path</h3>${rowBtn(NODE.reach, id)}
    ${l.stages.map((s, i) => `<button class="h3btn" style="${kv(id)}" data-stage="${id}:${i}">${i + 1} · ${esc(s)}</button>${stageNodes(id, i).map(n => rowBtn(n, id)).join("")}${moreRows(id + ":" + i, id)}`).join("")}
    <h3>Then, on every path</h3>${END_IDS.map(i => rowBtn(NODE[i], id)).join("")}
    ${id !== "founders" ? `<h3>Where this can lead</h3>${foundBtn(id)}` : ""}
    <h3>What it pays</h3><p>${esc(l.pay)}</p><h3>Know before you start</h3><p>${esc(l.caveat)}</p>
    ${ppl.length ? `<h3>Someone who did it</h3>${ppl.map(personBtn).join("")}` : ""}`);
  mark();
}
function showStage(id, i) {
  const l = LANE[id]; sel = null; ctx = id; lastInfo = () => showStage(id, i);
  const ns = stageNodes(id, i), more = extrasAt(id + ":" + i), moving = focus !== id;
  openPanel(`<div class="stepper" style="${kv(id)}"><button data-stage="${id}:${i - 1}" ${i <= 0 ? "disabled" : ""}>&#8249; Stage</button><span>${esc(l.name)}<br>stage ${i + 1} of ${l.stages.length}</span><button data-stage="${id}:${i + 1}" ${i >= l.stages.length - 1 ? "disabled" : ""}>Stage &#8250;</button></div>
    <p class="kind">${esc(l.name)} · stage ${i + 1}</p><h2>${esc(l.stages[i])}</h2>
    <p>${ns.length} ${ns.length === 1 ? "option" : "options"} at this stage. You don't need all of them. Pick the one you could start this week.</p>
    ${ns.map(n => rowBtn(n, id)).join("")}
    ${more.length ? `<h3>Smaller options, not on the map</h3>${more.map(n => rowBtn(n, id)).join("")}` : ""}
    ${i === l.stages.length - 1 && id !== "founders" ? `<h3>Where this can lead</h3>${foundBtn(id)}` : ""}
    <div class="btns"><button class="btn" data-lanego="${id}">Whole ${esc(l.name)} path</button></div>`);
  if (moving) setFocus(id); else { mark(); if (view === "map") setTimeout(() => reveal(SX[i], l.y), 440); }
}
// The end of every path can lead to founding something. What that tends to look like from each one:
const FOUND = {
  technical:"Researchers who have spent a few years on one problem start evaluation groups, security and interpretability startups, and new research organisations. Seldon Lab and Coefficient Giving's Project Tailwind both look for technical founders.",
  policy:"Policy people start think tanks, advocacy organisations and tools that help governments check what AI companies are doing. Knowing exactly which rule is missing is a strong place to start from.",
  outside:"People who keep showing up locally start chapters, campaigns and new advocacy organisations. Encode began as about 20 students opposing one ballot measure.",
  comms:"Creators and journalists start channels, newsletters and media organisations. The Future of Life Institute's Digital Media Accelerator funds exactly this.",
  ops:"Operators see the gaps first, because they are the ones working around them. Many founders in this field were running someone else's program two years earlier."
};
function showFound(l) {
  sel = null; ctx = l; lastInfo = () => showFound(l);
  openPanel(`<div class="stepper" style="${kv(l)}"><button data-lanego="${l}">&#8249; ${esc(LANE[l].name)}</button><span>Where this can lead</span></div>
    <p class="kind">${esc(LANE[l].name)} · then</p><h2>Start an organisation</h2>
    <p>The end of one path can be the start of another. Funders say money is not the bottleneck: founders are, and the best founders know a problem from the inside. A few years of doing the work is exactly that.</p>
    <p>${esc(FOUND[l])}</p>
    <h3>Where to start</h3>${["spinout", "bdincubator", "halcyon", "seed"].map(i => rowBtn(NODE[i], "founders")).join("")}
    <div class="btns"><button class="btn pri" data-lanego="founders">See the Founders path &#8250;</button></div>`);
  if (view === "map" && focus !== "founders") setFocus("founders"); else mark();
}
function showPerson(id) {
  const p = PERSON[id]; sel = p.at; lastInfo = () => showPerson(id);
  openPanel(`<div class="ph"><span class="av act" style="${kv(p.lane)}"><b style="color:#fff;font:700 22px var(--disp)">${p.ini}</b></span><div><p class="kind">A real route</p><h2>${esc(p.name)}</h2></div></div>
    <p><b>${esc(p.role)}</b></p><p>${esc(p.story)}</p><h3>Their route on this map</h3>${p.route.map(i => rowBtn(NODE[i])).join("")}
    <p class="mute" style="margin-top:12px">Every person on this map faced rejections along the way. None of them started qualified.</p>`);
  mark();
}
function showHome() {
  sel = null; lastInfo = showHome;
  openPanel(`<p class="kind">Start here</p><h2>Three steps for this week</h2>
    <p>You don't need to work out the whole path today. These three take about an hour between them and open most of the map.</p>
    ${["bd_agi", "advising", "reach"].map(i => rowBtn(NODE[i])).join("")}
    <div class="btns"><button class="btn pri" data-starter>Add all three to my plan</button><button class="btn" data-go="start" data-ctx="trunk" data-follow="1">Walk me through &#8250;</button></div>
    <h3>Or jump to a path</h3><div>${LANES.map(l => `<button class="pill" style="${kv(l.id)}" data-lanego="${l.id}">${esc(l.name)}</button>`).join("")}</div>`);
  mark();
}
let lastInfo = showHome;
function showPlan() {
  const ids = Object.keys(plan).filter(i => NODE[i]);
  openPanel(`<div class="plan"><h2>My plan</h2>
    ${ids.length ? `<p class="mute">Tick things off as you do them. Your plan is saved in this browser only.</p><ul>${ids.map(i => { const n = NODE[i]; return `<li><input type="checkbox" id="pl-${i}" data-done="${i}" ${plan[i].done ? "checked" : ""} aria-label="Done: ${esc(flat(n))}">
      <div class="t ${plan[i].done ? "done" : ""}"><b>${esc(flat(n))}</b><br><span>${esc(n.do)}</span>${n.url ? `<br><a href="${n.url}" target="_blank" rel="noopener">${esc(n.link || "Open site")} &#8599;</a>` : ""}</div>
      <button class="x" data-remove="${i}" aria-label="Remove">&times;</button></li>`; }).join("")}</ul>
      <div class="btns"><button class="btn pri" data-copy>Copy my plan</button></div><p class="mute" id="copied"></p>`
    : `<p>Nothing here yet. A plan with three small steps beats a long list you never open again.</p><div class="btns"><button class="btn pri" data-starter>Add three starter steps</button></div>
       <p class="mute">The starter steps are the AGI Strategy course, a free advising call and one message to someone in your field.</p>`}</div>`, true);
  mark();
}
function planText() { return "My AI safety plan\n\n" + Object.keys(plan).filter(i => NODE[i]).map(i => { const n = NODE[i]; return `[${plan[i].done ? "x" : " "}] ${flat(n)}: ${n.do}${n.url ? " " + n.url : ""}`; }).join("\n"); }

function renderList() {
  let h = "";
  if (focus === "all" || focus === "trunk") h += `<section><h2>Getting started</h2>${TRUNK_SEQ.map(i => NODE[i].type === "hub" ? `<h3>${esc(NODE[i].label)}</h3>${rowBtn(NODE[i], "trunk")}` : rowBtn(NODE[i], "trunk") + moreRows(i, "trunk")).join("")}</section>`;
  LANES.filter(l => focus === "all" || focus === l.id).forEach(l => h += `<section style="${kv(l.id)}"><h2>${esc(l.name)}</h2><p>${esc(l.myth)}</p><h3>First, on every path</h3>${rowBtn(NODE.reach, l.id)}${l.stages.map((s, i) => `<h3>${i + 1} · ${esc(s)}</h3>${stageNodes(l.id, i).map(n => rowBtn(n, l.id)).join("")}${moreRows(l.id + ":" + i, l.id)}`).join("")}<h3>Then, on every path</h3>${END_IDS.map(i => rowBtn(NODE[i], l.id)).join("")}${l.id !== "founders" ? `<h3>Where this can lead</h3>${foundBtn(l.id)}` : ""}</section>`);
  listwrap.innerHTML = h;
}
function setView(v) { view = v; wrap.hidden = v !== "map"; listwrap.hidden = v !== "list"; document.getElementById("vbtn").textContent = v === "map" ? "List view" : "Map view"; if (v === "list") renderList(); else { backings(); cancelAnimationFrame(anim); setVB(clampVB(viewFor(REG[focus]))); } }

chips.innerHTML = `<button class="chip dark" data-f="all">Whole map</button><button class="chip dark" data-f="trunk">Getting started</button>` +
  LANES.map(l => `<button class="chip" data-f="${l.id}" style="${kv(l.id)}">${esc(l.name)}</button>`).join("") +
  `<span class="sep"></span><button class="tool" id="zout" aria-label="Zoom out">&minus;</button><button class="tool" id="zin" aria-label="Zoom in">+</button><button class="tool" id="zfit">Fit</button><button class="tool" id="vbtn">List view</button>`;
chips.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.f) { const f = b.dataset.f; if (LANE[f]) { focus = f; showLane(f); flyTo(viewFor(REG[f])); } else if (f === "trunk") { focus = f; showHome(); flyTo(viewFor(REG[f])); } else setFocus(f); if (view === "list") renderList(); }
  else if (b.id === "vbtn") setView(view === "map" ? "list" : "map"); });
document.getElementById("zin").onclick = () => zoomAt(...centre(), .7, true);
document.getElementById("zout").onclick = () => zoomAt(...centre(), 1.43, true);
document.getElementById("zfit").onclick = () => flyTo(viewFor(REG[focus]));
planbtn.onclick = showPlan;

function goLane(l) { focus = l; showLane(l); if (view === "map") flyTo(viewFor(REG[l])); else renderList(); }
function activate(t) {
  const g = t.closest("[data-id],[data-lane],[data-person],[data-stage],[data-found]"); if (!g) return;
  if (g.dataset.id) showNode(g.dataset.id); else if (g.dataset.person) showPerson(g.dataset.person); else if (g.dataset.found) showFound(g.dataset.found);
  else if (g.dataset.stage) { const [l, i] = g.dataset.stage.split(":"); showStage(l, +i); }
  else goLane(g.dataset.lane);
}
svg.addEventListener("click", e => { if (dragged) { dragged = false; return; } activate(e.target); });
svg.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activate(e.target); } });
addEventListener("keydown", e => { if (/INPUT|TEXTAREA/.test(e.target.tagName) || panel.hidden || !sel) return; if (e.key === "ArrowRight") step(1); else if (e.key === "ArrowLeft") step(-1); });
function onPanelClick(e) {
  const b = e.target.closest("button"); if (!b) return; const d = b.dataset;
  if ("close" in d) { panel.hidden = true; sel = null; mark(); if (view === "map") flyTo(viewFor(REG[focus])); }
  else if (d.tab) d.tab === "plan" ? showPlan() : lastInfo();
  else if (d.step) step(+d.step);
  else if (d.back) { const [l, i] = d.back.split(":"); i === undefined ? showNode(l, ctx) : showStage(l, +i); }
  else if (d.found) showFound(d.found);
  else if (d.stage) { const [l, i] = d.stage.split(":"); showStage(l, +i); }
  else if (d.plan) { plan[d.plan] ? delete plan[d.plan] : plan[d.plan] = { done: false }; save(); showNode(d.plan, ctx); if (view === "list") renderList(); }
  else if (d.go) showNode(d.go, d.ctx, !!d.follow || !!d.ctx);
  else if (d.person) showPerson(d.person);
  else if (d.lanego) goLane(d.lanego);
  else if (d.remove) { delete plan[d.remove]; save(); showPlan(); }
  else if ("starter" in d) { ["bd_agi", "advising", "reach"].forEach(i => plan[i] = plan[i] || { done: false }); save(); showPlan(); }
  else if ("copy" in d) { const t = planText(), out = document.getElementById("copied");
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => out.textContent = "Copied. Paste it somewhere you'll see it tomorrow.", () => { out.innerHTML = `<textarea id="plantext" rows="8" style="width:100%" aria-label="Your plan as text">${esc(t)}</textarea>`; document.getElementById("plantext").select(); }); }
}
panel.addEventListener("click", onPanelClick);
panel.addEventListener("change", e => { const i = e.target.dataset.done; if (i && plan[i]) { plan[i].done = e.target.checked; save(); showPlan(); } });
listwrap.addEventListener("click", e => { const b = e.target.closest("[data-go],[data-found]"); if (!b) return; b.dataset.found ? showFound(b.dataset.found) : showNode(b.dataset.go, b.dataset.ctx); });

draw();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(backings);
const h0 = location.hash.slice(1);
if (h0 === "list" || (!h0 && innerWidth < 700)) setView("list");
if (REG[h0] && h0 !== "all") { focus = h0; if (LANE[h0]) showLane(h0); else showHome(); }
else if (NODE[h0]) { const n = NODE[h0]; focus = n.lanes.length === 1 ? n.lanes[0] : n.lanes.length ? "all" : "trunk"; showNode(h0); }
else if (PERSON[h0]) showPerson(h0); else if (h0 === "plan") showPlan();
cancelAnimationFrame(anim); setVB(clampVB(viewFor(REG[focus]))); mark();
</script>
